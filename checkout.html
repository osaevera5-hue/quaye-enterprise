<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | WoodCraft</title>

<link rel="stylesheet" href="css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>


<header class="navbar">

<a href="index.html" class="logo">
<span>WOOD</span>CRAFT
</a>

<nav id="navMenu">

<a href="index.html">Home</a>
<a href="shop.html">Shop</a>
<a href="about.html">About</a>
<a href="contact.html">Contact</a>

<a href="cart.html">
Cart <span id="cartCount">0</span>
</a>

</nav>

<button class="menu-btn" onclick="toggleMenu()">☰</button>

</header>


<section class="page-header">

<p>CHECKOUT</p>

<h1>Complete Your Order</h1>

</section>


<section class="checkout-section">


<div class="checkout-form">

<h2>Customer Information</h2>


<form onsubmit="submitOrder(event)">


<label>
Full Name
</label>

<input
type="text"
id="customerName"
placeholder="Your full name"
required
>


<label>
Phone Number
</label>

<input
type="tel"
id="customerPhone"
placeholder="024 XXX XXXX"
required
>


<label>
Email Address
</label>

<input
type="email"
id="customerEmail"
placeholder="you@example.com"
>


<label>
Delivery Location
</label>

<input
type="text"
id="customerLocation"
placeholder="Town / City"
required
>


<label>
Delivery Address
</label>

<textarea
id="customerAddress"
placeholder="Enter your delivery address"
required
></textarea>


<h2>Payment Method</h2>


<div class="payment-options">

<label class="payment-option">

<input
type="radio"
name="payment"
value="Mobile Money"
checked
>

<span>
Mobile Money
</span>

</label>


<label class="payment-option">

<input
type="radio"
name="payment"
value="Card"
>

<span>
Debit / Credit Card
</span>

</label>

</div>

 <button type="button" class="btn checkout-submit" onclick="goToPayment()">
    Continue to Payment
</button>

</form>

</div>


<div class="order-summary">

<h2>Your Order</h2>

<div id="checkoutItems"></div>

<hr>

<div class="summary-row">

<span>Total</span>

<strong id="checkoutTotal">
GH₵ 0
</strong>

</div>

</div>


</section>


<footer>

<div class="copyright">

© 2026 WoodCraft. All Rights Reserved.

</div>

</footer>


<script src="js/script.js"></script>

</body>
</html>
